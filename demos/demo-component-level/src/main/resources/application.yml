server:
  port: 8081

spring:
  application:
    name: component-level-rag-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai_rag_dev
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Manually manage Flyway (not via Starter auto-configuration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        enabled: false
        options:
          model: deepseek-chat
          temperature: 0.7

app:
  llm:
    provider: openai

# ================================================================
# Embedding Model (SiliconFlow)
# ================================================================
rag:
  embedding:
    api-key: ${RAG_EMBEDDING_API_KEY:}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}

# ================================================================
# RAG Configuration
# ================================================================
  retrieval:
    fulltext-enabled: true
    fulltext-strategy: auto
    vector-weight: 0.5
    fulltext-weight: 0.5
    default-limit: 10
    min-score: 0.3
  memory:
    max-messages: 20

logging:
  level:
    com.springairag: DEBUG
