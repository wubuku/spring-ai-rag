# ============================================
# Demo-basic-rag: Standalone Spring Boot Application Config
# Uses real keys and DB connection from .env
# ============================================

server:
  port: 8081
  shutdown: graceful
  tomcat:
    max-swallow-size: ${SERVER_MAX_SWALLOW_SIZE:100MB}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,text/javascript
    min-response-size: 1024

spring:
  application:
    name: customer-service-bot

  # PostgreSQL 是 demo 的默认数据库；postgresql profile 负责注册 embedding
  # profile 引导（含 HNSW 索引）与后台 worker。未显式设置时默认打开，
  # 避免 `java -jar` 直接启动时静默跑在"没有索引、没有 worker"的降级配置上。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgresql}

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT_PER_PHASE:30s}

  main:
    allow-bean-definition-overriding: true

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  # demo 的 application.yml 会遮蔽 core jar 内的同名文件；OSIV 默认 true 会让
  # 每个 HTTP 请求在检索/调用模型期间一直占住一个 DB 连接，高并发下极易耗尽连接池。
  jpa:
    open-in-view: false

  task:
    scheduling:
      timezone: ${APP_CRON_TIME_ZONE:Asia/Shanghai}

  autoconfigure:
    exclude:

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:spring_ai_rag_dev}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # 与 core 配置保持一致：池耗尽在 connection-timeout 后快速失败，
      # statement_timeout 让慢查询/锁等待不会永久占住连接。
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      connection-init-sql: "SET statement_timeout = ${DB_STATEMENT_TIMEOUT_MS:30000}"
      data-source-properties:
        options: "-c TimeZone=UTC"

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      # 与根目录 .env.example 对齐；同时保留 OPENAI_* 旧变量名回退，
      # 避免既有本地 .env 因变量改名而静默失效。
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:${OPENAI_BASE_URL:}}
      chat:
        enabled: false
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:${OPENAI_MODEL:}}
          temperature: 0.7

app:
  llm:
    provider: ${LLM_PROVIDER:openai}

rag:
  time-zone: ${RAG_TIME_ZONE:UTC}
  embedding:
    api-key: ${RAG_EMBEDDING_API_KEY:}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    profile-key: ${RAG_EMBEDDING_PROFILE_KEY:siliconflow-bge-m3-1024-v1}
  retrieval:
    fulltext-enabled: true
    fulltext-strategy: auto
    vector-weight: 0.5
    fulltext-weight: 0.5
    default-limit: 10
    min-score: 0.3
  memory:
    max-messages: 20
  security:
    # demo 的 application.yml 会遮蔽 core jar 内的同名文件（fat jar 中 BOOT-INF/classes
    # 优先于依赖 jar），因此必须在本地重复声明这些占位符；否则容器里注入的
    # RAG_ROOT_API_KEY / RAG_ALLOW_INSECURE_UPSTREAM 会被静默忽略。
    enabled: ${RAG_SECURITY_ENABLED:false}
    root-api-key: ${RAG_ROOT_API_KEY:}
    allow-insecure-upstream: ${RAG_ALLOW_INSECURE_UPSTREAM:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    # 本机绝对路径不应出现在公开健康详情里；容器用配额判断磁盘健康。
    diskspace:
      enabled: false

logging:
  level:
    com.springairag: DEBUG
    org.springframework.ai: INFO
