# ============================================
# Demo-basic-rag: Standalone Spring Boot Application Config
# Uses real keys and DB connection from .env
# ============================================

server:
  port: 8081

spring:
  application:
    name: customer-service-bot

  main:
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:spring_ai_rag_dev}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      # 与根目录 .env.example 对齐；同时保留 OPENAI_* 旧变量名回退，
      # 避免既有本地 .env 因变量改名而静默失效。
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:${OPENAI_BASE_URL:}}
      chat:
        enabled: false
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:${OPENAI_MODEL:}}
          temperature: 0.7

app:
  llm:
    provider: ${LLM_PROVIDER:openai}

rag:
  embedding:
    api-key: ${RAG_EMBEDDING_API_KEY:}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    profile-key: ${RAG_EMBEDDING_PROFILE_KEY:siliconflow-bge-m3-1024-v1}
  retrieval:
    fulltext-enabled: true
    fulltext-strategy: auto
    vector-weight: 0.5
    fulltext-weight: 0.5
    default-limit: 10
    min-score: 0.3
  memory:
    max-messages: 20
  security:
    # demo 的 application.yml 会遮蔽 core jar 内的同名文件（fat jar 中 BOOT-INF/classes
    # 优先于依赖 jar），因此必须在本地重复声明这两个占位符；否则容器里注入的
    # RAG_ROOT_API_KEY 会被静默忽略，认证开启后没有任何可用凭据。
    enabled: ${RAG_SECURITY_ENABLED:false}
    root-api-key: ${RAG_ROOT_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.springairag: DEBUG
    org.springframework.ai: INFO
