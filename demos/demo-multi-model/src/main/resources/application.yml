# ============================================
# Spring AI RAG — Multi-Model Demo Configuration
# ============================================
# Usage:
#   1. Copy .env.example to .env and fill in real API keys
#   2. mvn -f demos/demo-multi-model/pom.xml spring-boot:run
#   3. curl http://localhost:8081/demo/models
# ============================================

server:
  port: 8081
  tomcat:
    max-swallow-size: ${SERVER_MAX_SWALLOW_SIZE:100MB}

spring:
  application:
    name: spring-ai-rag-multi-model-demo

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  task:
    scheduling:
      timezone: ${APP_CRON_TIME_ZONE:Asia/Shanghai}

  # PostgreSQL configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:${POSTGRES_DB:spring_ai_rag_dev}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      connection-init-sql: "SET statement_timeout = ${DB_STATEMENT_TIMEOUT_MS:30000}"
      data-source-properties:
        options: "-c TimeZone=UTC"

  # Flyway database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # OpenAI-compatible configuration (DeepSeek / SiliconFlow, etc.)
  # To switch provider: modify app.llm.provider
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        enabled: false   # ChatModel beans are manually created by SpringAiConfig
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7
          maxTokens: 8192

# ============================================
# Spring AI RAG Core Configuration
# ============================================
app:
  # Default LLM provider: openai | anthropic | minimax
  # At runtime, switch dynamically via /demo/chat?provider=xxx
  llm:
    provider: ${LLM_PROVIDER:openai}

rag:
  time-zone: ${RAG_TIME_ZONE:UTC}
  embedding:
    api-key: ${RAG_EMBEDDING_API_KEY:}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    profile-key: ${RAG_EMBEDDING_PROFILE_KEY:siliconflow-bge-m3-1024-v1}
  security:
    # 与 core application.yml 对齐：demo 配置会遮蔽依赖 jar 的同名文件。
    enabled: ${RAG_SECURITY_ENABLED:false}
    root-api-key: ${RAG_ROOT_API_KEY:}
  retrieval:
    default-limit: 5
    vector-weight: 0.7
    fulltext-weight: 0.3
    min-score: 0.3
  rerank:
    enabled: true
    top-n: 3

# ============================================
# Actuator Health Checks
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ============================================
# Logging Configuration
# ============================================
logging:
  level:
    com.springairag: DEBUG
    org.springframework.ai: INFO
