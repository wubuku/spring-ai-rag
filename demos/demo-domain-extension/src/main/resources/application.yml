# ============================================================
# Domain Extension Example — Medical Consultation
# ============================================================

server:
  port: 8081

spring:
  # DataSource (PostgreSQL + pgvector)
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai_rag_dev
    username: postgres
    password: postgres

  # Flyway auto-migration
  flyway:
    enabled: true
    locations: classpath:db/migration

  # AI model configuration (OpenAI-compatible, e.g. DeepSeek)
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        enabled: false
        options:
          model: deepseek-chat
          temperature: 0.7

# ============================================================
# Spring AI RAG Configuration
# ============================================================
app:
  llm:
    provider: openai

rag:
  embedding:
    api-key: ${RAG_EMBEDDING_API_KEY:}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
  memory:
    max-messages: 20

# ============================================================
# Monitoring Configuration
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
