# ============================================================
# Domain Extension Example — Medical Consultation
# ============================================================

server:
  port: 8081

spring:
  # DataSource (PostgreSQL + pgvector)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:spring_ai_rag_dev}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  # Flyway auto-migration
  flyway:
    enabled: true
    locations: classpath:db/migration

  # AI model configuration (OpenAI-compatible, e.g. DeepSeek)
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        enabled: false
        options:
          model: deepseek-chat
          temperature: 0.7

# ============================================================
# Spring AI RAG Configuration
# ============================================================
app:
  llm:
    provider: openai

rag:
  embedding:
    api-key: ${RAG_EMBEDDING_API_KEY:}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    profile-key: ${RAG_EMBEDDING_PROFILE_KEY:siliconflow-bge-m3-1024-v1}
  memory:
    max-messages: 20
  security:
    # demo 配置会遮蔽 core 的同名文件，必须显式声明占位符。
    enabled: ${RAG_SECURITY_ENABLED:false}
    root-api-key: ${RAG_ROOT_API_KEY:}

# ============================================================
# Monitoring Configuration
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
