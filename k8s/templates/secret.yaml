{{/*
Secret: sensitive credentials.
All values are base64-encoded by Helm at render time.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spring-ai-rag.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-ai-rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Spring profile ────────────────────────────────────────────────────────
  {{- if .Values.secrets.springProfile }}
  SPRING_PROFILES_ACTIVE: {{ .Values.secrets.springProfile | quote }}
  {{- end }}

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  POSTGRES_HOST:     {{ .Values.secrets.postgresHost | quote }}
  POSTGRES_PORT:     {{ .Values.secrets.postgresPort | quote }}
  POSTGRES_DATABASE: {{ .Values.secrets.postgresDatabase | quote }}
  POSTGRES_USER:     {{ .Values.secrets.postgresUsername | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}

  # ── DeepSeek / OpenAI-compatible LLM ─────────────────────────────────────
  # `secrets.deepseekApiKey` is required and feeds OPENAI_API_KEY directly below.
  # It used to be injected into the container as `DEEPSEEK_API_KEY` as well, and
  # nothing there has ever read it: `application.yml` resolves
  # `${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:dummy}}`, and `deepseek` appears in
  # the main modules only as a model-name string in a DTO schema and a test.
  #
  # The name comes from `docker/docker-compose.yml`, where `DEEPSEEK_API_KEY` is a
  # **host-side** fallback: compose resolves `${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-…}}`
  # before the container exists. That substitution has no meaning inside a running
  # container, so copying the entry here put a key in the process environment that
  # the application ignores — same vocabulary, different layer.
  OPENAI_API_KEY:   {{ default .Values.secrets.deepseekApiKey .Values.secrets.openaiApiKey | quote }}
  OPENAI_BASE_URL:   {{ .Values.secrets.openaiBaseUrl | quote }}
  OPENAI_MODEL:      {{ .Values.secrets.openaiModel | quote }}

  # ── Embedding provider ───────────────────────────────────────────────────
  RAG_EMBEDDING_API_KEY: {{ required "secrets.embeddingApiKey is required" .Values.secrets.embeddingApiKey | quote }}
  RAG_EMBEDDING_BASE_URL: {{ .Values.secrets.embeddingBaseUrl | quote }}
  RAG_EMBEDDING_MODEL: {{ .Values.secrets.embeddingModel | quote }}
  RAG_EMBEDDING_DIMENSIONS: {{ .Values.secrets.embeddingDimensions | quote }}

  # ── Anthropic (optional) ──────────────────────────────────────────────────
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}

  # ── MiniMax (optional) ────────────────────────────────────────────────────
  # Gated on `minimaxApiKey` alone. It used to require `minimaxApiKeyId` as well,
  # and nothing read that: Spring AI's own metadata
  # (`spring-ai-autoconfigure-model-minimax`, META-INF/spring-configuration-metadata.json)
  # declares `api-key`, `base-url` and `chat.options.*` and **no `api-key-id`**, and
  # `application.yml` reads `MINIMAX_API_KEY` / `MINIMAX_BASE_URL` / `MINIMAX_MODEL`.
  # So an operator who set `secrets.minimaxApiKey` and followed the application's own
  # vocabulary silently received no MiniMax environment at all — the chart was gating
  # the block on a variable only it knew about.
  {{- if .Values.secrets.minimaxApiKey }}
  MINIMAX_API_KEY:  {{ .Values.secrets.minimaxApiKey | quote }}
  MINIMAX_BASE_URL: {{ .Values.secrets.minimaxBaseUrl | quote }}
  {{- end }}
