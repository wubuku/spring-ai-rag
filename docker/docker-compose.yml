# ============================================
# Spring AI RAG - docker-compose
# PostgreSQL + pgvector + RAG service
# ============================================

services:
  # PostgreSQL + pgvector vector database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spring-ai-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spring_ai_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring AI RAG service
  rag-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: spring-ai-rag-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:8081"
    # 应用启用 server.shutdown=graceful，默认 30s 等待在途请求；容器停止窗口需覆盖它。
    stop_grace_period: 30s
    # 容器安全基线：根文件系统只读，唯一可写目录挂在临时内存盘；
    # 进程不获得新权限，并丢弃全部 Linux capabilities（Java 运行不需要）。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    environment:
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-spring_ai_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # LLM configuration (DeepSeek example, modify as needed)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-your-key-here}
      # General OpenAI-compatible configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-sk-your-key-here}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      # Embedding model (example: SiliconFlow BGE-M3)
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-sk-your-key-here}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-https://api.siliconflow.cn}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      # Profiles: postgresql for pgvector; prod enables API key auth + circuit breakers.
      # `prod` refuses to start when RAG_SECURITY_ENABLED=false.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgresql,prod}
      # Authentication stays on by default. For an isolated local demo without
      # auth, set both SPRING_PROFILES_ACTIVE=postgresql and RAG_SECURITY_ENABLED=false.
      RAG_SECURITY_ENABLED: ${RAG_SECURITY_ENABLED:-true}
      # Recommended: environment root API key. Optional legacy static key also works.
      RAG_ROOT_API_KEY: ${RAG_ROOT_API_KEY:-}
      RAG_API_KEY: ${RAG_API_KEY:-}

volumes:
  pgdata:
