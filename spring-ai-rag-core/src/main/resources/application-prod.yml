# Production profile — safe defaults for deployment
# Activate: SPRING_PROFILES_ACTIVE=prod  or  prod,postgresql
#
# Set RAG_ROOT_API_KEY (at least 32 printable ASCII characters) to enable the standalone
# service MVP. In root mode the legacy log bootstrap is disabled.

rag:
  security:
    # Require X-API-Key or ?apiKey= on /api/** in legacy mode.
    # A configured RAG_ROOT_API_KEY overrides this flag and rejects query credentials.
    enabled: true
    # Optional legacy static key; leave empty to rely on DB keys from bootstrap / management API
    api-key: ${RAG_API_KEY:}

  circuit-breaker:
    enabled: true
    failure-rate-threshold: 50
    minimum-number-of-calls: 10
    wait-duration-in-open-state: 30
    sliding-window-size: 20

  embedding-circuit-breaker:
    enabled: true
    failure-rate-threshold: 50
    minimum-number-of-calls: 10
    wait-duration-in-open-state: 30
    sliding-window-size: 20

  rate-limit:
    # Optional: enable under load; default off to avoid surprising first deploy
    enabled: ${RAG_RATE_LIMIT_ENABLED:false}

  # Quality defaults for production (measurable via /api/v1/rag/evaluation/* + goldenset script)
  query-rewrite:
    enabled: true
  rerank:
    # Heuristic rerank is local/no extra API cost; set provider=http + RERANK_API_KEY for cross-encoder
    enabled: ${RAG_RERANK_ENABLED:true}
    provider: ${RAG_RERANK_PROVIDER:heuristic}
    diversity-weight: 0.2
    top-n: 5
    fallback-to-heuristic: true
  retrieval:
    default-limit: 10
    min-score: 0.25
    vector-weight: 0.55
    fulltext-weight: 0.45
  chat:
    knowledge:
      query-transformer: spring-ai

logging:
  level:
    com.springairag.core.filter.ApiKeyAuthFilter: INFO
