name: CI

# PR 快层：单元/契约测试、仓库级静态门禁、WebUI Mock E2E 与构建。
# 长跑层（gated PostgreSQL、真实 LLM、goldenset、有界 soak、真实 WebUI spec）
# 在 `.github/workflows/nightly.yml`；两层的边界与本地复现命令见
# `docs/testing-guide-zh-CN.md` 的「CI 分层」章节。
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit, contract, static gates)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: spring_ai_rag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LLM_PROVIDER: openai
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: spring_ai_rag_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # psql 不会自动读取 POSTGRES_PASSWORD；服务容器要求密码认证，
      # 缺 PGPASSWORD 时建库步骤会失败（fe_sendauth: no password supplied）。
      PGPASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/spring_ai_rag_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key' }}
      OPENAI_BASE_URL: https://api.minimaxi.com
      OPENAI_MODEL: MiniMax-M2.7
      RAG_EMBEDDING_API_KEY: ${{ secrets.RAG_EMBEDDING_API_KEY || 'test-key' }}
      RAG_EMBEDDING_BASE_URL: https://api.siliconflow.cn
      RAG_EMBEDDING_MODEL: BAAI/bge-m3
      RAG_EMBEDDING_DIMENSIONS: 1024
      # 干净 checkout 里 `git diff HEAD` 是空 diff；把仓库文档门禁的
      # "新增行密钥扫描"指向 PR 的 merge-base，否则它在 CI 里永远通过。
      DOCS_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Create test database and extensions
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE spring_ai_rag_test" 2>/dev/null || true
          psql -h localhost -U postgres -d spring_ai_rag_test -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h localhost -U postgres -d spring_ai_rag_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          # pg_jieba 是可选扩展，pgvector 官方镜像不含它；V1 迁移和检索 provider
          # 在缺失时会自动降级到 pg_trgm / 纯向量。这里只记录可用性，不把
          # “装不上”当成失败，否则后端 job 会在建库阶段就红。
          if psql -h localhost -U postgres -d spring_ai_rag_test \
              -c "CREATE EXTENSION IF NOT EXISTS pg_jieba"; then
            echo "pg_jieba: available"
          else
            echo "pg_jieba: unavailable (optional; fulltext falls back to pg_trgm)"
          fi | tee -a "$GITHUB_STEP_SUMMARY"

      # 仓库级门禁链需要 ripgrep；runner 镜像通常已带，缺失时再安装。
      - name: Ensure gate dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Install modules (skip tests, install to local Maven repo)
        run: mvn install -DskipTests -B -q

      - name: Build & Test with JaCoCo
        run: |
          set -o pipefail
          mkdir -p .verification/ci
          mvn test -B 2>&1 | tee .verification/ci/mvn-test.log

      # demo 不在根 reactor 中，`mvn test` 不会覆盖它；这里单独跑配置绑定测试，
      # 防止 demo 的 application.yml 遮蔽 core 配置后环境变量静默失效。
      - name: Demo environment binding tests
        run: |
          set -o pipefail
          mvn -B -f demos/demo-basic-rag/pom.xml test 2>&1 \
            | tee .verification/ci/demo-binding-test.log

      # 必须紧跟全量 `mvn test`：verify-test-visibility 读取这次运行产生的
      # surefire 报告，而 gated IT 会覆盖同一批文件（gated IT 已移到 nightly）。
      - name: Repository gate chain (visibility, wiring, inert tests)
        run: |
          set -o pipefail
          ./scripts/verify-project-tests.sh 2>&1 | tee .verification/ci/repo-test-gates.log

      - name: Documentation and i18n integrity
        run: |
          set -o pipefail
          ./scripts/verify-project-docs.sh 2>&1 | tee .verification/ci/repo-doc-gates.log

      # `mvn test` 不会启动数据库（契约测试显式关闭 Flyway），所以这里查
      # `flyway_schema_history` 只会得到 “relation does not exist”，然后对一棵
      # 健康的树报出 drift。迁移是否真的能应用由 nightly `gated-postgres` 证明
      # （Spring Boot + Flyway + MigrationVersions）；PR 层只校验清单本身是否
      # 结构正确，这一步既能早失败，也不会假装自己执行了迁移。
      - name: Flyway migration inventory
        run: |
          set -euo pipefail
          dir=spring-ai-rag-core/src/main/resources/db/migration
          mapfile -t versions < <(find "$dir" -maxdepth 1 -name 'V*.sql' -printf '%f\n' \
            | sed -E 's/^V([0-9]+)__.*$/\1/' | sort -n)
          count=${#versions[@]}
          {
            echo "## Flyway Migration Inventory"
            echo ""
            echo "- scripts: ${count}"
            echo "- earliest: ${versions[0]}"
            echo "- latest: ${versions[$((count - 1))]}"
          } >> "$GITHUB_STEP_SUMMARY"
          unparseable="$(find "$dir" -maxdepth 1 -name 'V*.sql' -printf '%f\n' \
            | grep -Ev '^V[0-9]+__[A-Za-z0-9_-]+\.sql$' || true)"
          if [ -n "${unparseable}" ]; then
            echo "::error::Flyway filenames not matching V<number>__<name>.sql: ${unparseable}"
            exit 1
          fi
          duplicates="$(printf '%s\n' "${versions[@]}" | uniq -d)"
          if [ -n "${duplicates}" ]; then
            echo "::error::Duplicate Flyway versions: ${duplicates}"
            exit 1
          fi
          echo "Flyway inventory OK: ${count} script(s), V${versions[0]}..V${versions[$((count - 1))]}"

      # 接口兼容门禁：启动 demo 取真实 /v3/api-docs，与提交的基线比对。
      # 只验证契约形状，不调用真实模型；新增可选字段不算破坏。
      - name: OpenAPI breaking-change gate
        run: |
          set -euo pipefail
          mvn -B -DskipTests -f demos/demo-basic-rag/pom.xml package -q
          jar="$(ls demos/demo-basic-rag/target/demo-basic-rag-*.jar | head -1)"
          RAG_EMBEDDING_PROFILE_KEY=siliconflow-bge-m3-1024-v1 \
          RAG_RETRIEVAL_MIN_SCORE=0 \
            java -jar "$jar" --server.port=18090 --rag.security.enabled=false \
            > /tmp/openapi-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18090/actuator/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::demo did not become healthy for OpenAPI gate"
            tail -n 40 /tmp/openapi-app.log || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:18090/v3/api-docs -o /tmp/openapi-current.json
          node scripts/verify-openapi-breaking-change.mjs --self-test
          node scripts/verify-openapi-breaking-change.mjs \
            --current /tmp/openapi-current.json

      - name: Package
        run: mvn package -DskipTests -B

      - name: Failure diagnostics summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .verification/ci
          node .github/scripts/ci-summary.mjs --surefire --jacoco \
            | tee .verification/ci/summary.md

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-gate-logs
          path: .verification/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          flags: 'maven,jacoco'
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  webui:
    name: WebUI (typecheck, lint, unit, mock E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: spring-ai-rag-webui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spring-ai-rag-webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Lint (ESLint, alignment policy, design tokens)
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      # 静态产物入库（jar 内直接可用），因此必须证明重建结果与提交一致；
      # 只比较内容，不比较 mtime。锁定依赖下实测逐字节可复现。
      - name: Committed static build matches a fresh build
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          diff -r dist ../spring-ai-rag-core/src/main/resources/static/webui

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('spring-ai-rag-webui/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Backend-free performance budget: initial asset gzip/uncompressed size,
      # critical resource count, local FCP, and Slow 4G FCP. The script serves
      # `dist` from a local static server and measures with Playwright Chromium;
      # no Spring Boot instance is required. Budget values live in
      # `scripts/testdata/performance-budget.json`. This step must follow
      # "Install Playwright browsers" because it launches Chromium.
      - name: Performance budget (no backend)
        run: npm run check:performance-budget

      # Backend-free browser suite. `playwright.preview.config.ts` serves the
      # production build with `vite preview` on port 15174 and every API call is
      # intercepted via `page.route` (e2e/api-mocks.ts), so no Spring Boot instance
      # is required. The `*-real.spec.ts` specs are excluded by that config and run
      # in nightly instead. `playwright.config.ts` sets `retries: 0` on purpose:
      # the suite must be green on the first try, and a failure here is a real
      # signal rather than a candidate for an automatic re-run.
      - name: Mock E2E (Playwright)
        run: npm run test:e2e:mock

      # 视觉基准按平台分文件（*-chromium-linux.png）。为了让 CI 与生成基准时
      # 的字体/渲染完全一致，这里固定使用与 package-lock 中 @playwright/test
      # 同版本的官方镜像，而不是 runner 上临时安装的浏览器。
      # 复用 `scripts/verify-visual-regression.sh`，让 CI 与本地走同一条入口；
      # 仓库门禁 `verify-e2e-run-paths.mjs` 也要求 visual.spec.ts 在 scripts/
      # 里有真实的 Playwright 调用，否则判定为不可达 spec。
      - name: Visual regression (Chromium)
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e HOME=/tmp \
            -e CI=1 \
            mcr.microsoft.com/playwright:v1.59.1-noble \
            bash /work/scripts/verify-visual-regression.sh

      - name: Failure diagnostics summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.verification/ci"
          node "$GITHUB_WORKSPACE/.github/scripts/ci-summary.mjs" --playwright \
            | tee "$GITHUB_WORKSPACE/.verification/ci/webui-summary.md"

      - name: Upload WebUI coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webui-coverage
          path: spring-ai-rag-webui/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webui-playwright-report
          path: |
            spring-ai-rag-webui/playwright-report/
            spring-ai-rag-webui/test-results/
            .verification/ci/
          if-no-files-found: warn
          retention-days: 14
