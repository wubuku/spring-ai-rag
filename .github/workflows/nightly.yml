name: Nightly

# 长跑层：gated PostgreSQL 集成测试、真实 LLM 冒烟 + 检索质量、有界 soak、
# 真实 WebUI spec（不含需要人工 fixture 的 alerts / rerank）。
# PR 快层在 `.github/workflows/ci.yml`；边界与本地复现命令见
# `docs/testing-guide-zh-CN.md` 的「CI 分层」章节。
on:
  schedule:
    # GitHub 的 cron 一律按 UTC 解释，不跟随仓库或 runner 时区。
    # 这里 18:00 UTC = 次日 02:00 Asia/Shanghai；中国无夏令时，不需要季节调整。
    # GitHub 的 schedule 常见数分钟到数十分钟延迟，不能当作精确闹钟。
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      debug_report_failure:
        description: '只跑 report job，并强制走失败分支（创建 [TEST] issue，不触发真实模型调用）'
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gated-postgres:
    name: Gated PostgreSQL integration suites
    if: github.event_name == 'schedule' || inputs.debug_report_failure != true
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers 自带 PostgreSQL；这里只预热镜像，避免首次拉取计入测试超时。
      - name: Pre-pull Testcontainers image
        run: docker pull pgvector/pgvector:pg16 || true

      - name: Run gated PostgreSQL suites
        run: |
          set -o pipefail
          mkdir -p .verification/nightly
          ./scripts/verify-gated-it.sh 2>&1 | tee .verification/nightly/gated-it.log

      - name: Failure diagnostics summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .verification/nightly
          node .github/scripts/ci-summary.mjs --surefire \
            | tee .verification/nightly/summary.md

      - name: Upload gated IT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gated-it
          path: |
            .verification/nightly/
            **/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

  real-llm:
    name: Real LLM smoke, goldenset and retrieval regression
    if: github.event_name == 'schedule' || inputs.debug_report_failure != true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LLM_PROVIDER: minimax
      SPRING_AI_MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY || secrets.SPRING_AI_MINIMAX_API_KEY }}
      SPRING_AI_MINIMAX_BASE_URL: ${{ vars.SPRING_AI_MINIMAX_BASE_URL || 'https://api.minimaxi.com' }}
      SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL: ${{ vars.SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL || 'MiniMax-M3' }}
      RAG_EMBEDDING_API_KEY: ${{ secrets.RAG_EMBEDDING_API_KEY }}
      RAG_EMBEDDING_BASE_URL: ${{ vars.RAG_EMBEDDING_BASE_URL || 'https://api.siliconflow.cn' }}
      RAG_EMBEDDING_MODEL: BAAI/bge-m3
      RAG_EMBEDDING_DIMENSIONS: '1024'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: rag_nightly_llm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rag_nightly_llm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      BASE_URL: http://127.0.0.1:18081
      # 单次 run 的硬上限。real-llm job 的后端只服务本次检查，计数包含启动
      # 健康检查轮询，所以给足余量；超过说明出现了预期外的请求/重试循环。
      NIGHTLY_MAX_REQUESTS: '300'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify required secrets
        run: |
          missing=()
          [ -n "${SPRING_AI_MINIMAX_API_KEY:-}" ] || missing+=("MINIMAX_API_KEY (or SPRING_AI_MINIMAX_API_KEY)")
          [ -n "${RAG_EMBEDDING_API_KEY:-}" ] || missing+=("RAG_EMBEDDING_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::Nightly real-LLM layer cannot run: missing repository secret '$name'."
            done
            {
              echo "## Nightly real-LLM layer not run"
              echo ""
              echo "Missing repository secret(s):"
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo ""
              echo "Configure the secrets in Settings → Secrets and variables → Actions, "
              echo "or disable the schedule. Failing here is intentional: a nightly run that "
              echo "silently skips real-model coverage is worse than a red run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # `start-real-e2e-server.sh` 用 `dependency:build-classpath` 解析模块
      # jar；干净 checkout 的本地仓库里没有本项目产物时会去 central 拉取，
      # 而 Maven 3.10+ 的 prefix 过滤会直接拒绝（ArtifactFilteredOutException）。
      # 先 install 一遍即可让后续步骤全部从本地仓库解析。
      - name: Build modules into local repository
        run: mvn -q -B -DskipTests install

      - name: Create isolated database
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE rag_nightly_llm" 2>/dev/null || true
          psql -h localhost -U postgres -d rag_nightly_llm -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h localhost -U postgres -d rag_nightly_llm -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          # pg_jieba 为可选扩展，pgvector 镜像不含它；迁移会降级到 pg_trgm。
          if psql -h localhost -U postgres -d rag_nightly_llm \
              -c "CREATE EXTENSION IF NOT EXISTS pg_jieba"; then
            echo "pg_jieba: available"
          else
            echo "pg_jieba: unavailable (optional; fulltext falls back to pg_trgm)"
          fi

      # 仓库脚本按约定从 `.env` 读取凭据；runner 是临时环境，文件不会进入制品。
      - name: Materialize .env for repository scripts
        run: |
          umask 077
          : > .env
          for name in \
            LLM_PROVIDER \
            SPRING_AI_MINIMAX_API_KEY SPRING_AI_MINIMAX_BASE_URL SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL \
            RAG_EMBEDDING_API_KEY RAG_EMBEDDING_BASE_URL RAG_EMBEDDING_MODEL RAG_EMBEDDING_DIMENSIONS \
            POSTGRES_HOST POSTGRES_PORT POSTGRES_DATABASE POSTGRES_USER POSTGRES_PASSWORD \
            SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD; do
            value="${!name:-}"
            [ -z "$value" ] || printf '%s=%s\n' "$name" "$value" >> .env
          done

      # 后端独立成一步启动，检查、用量护栏、停止各自成步：这样即使检查失败，
      # 护栏仍能读到指标并解释"本次 run 用掉了多少请求"，而不是和进程一起退出。
      - name: Start backend
        run: |
          set -euo pipefail
          ./scripts/start-real-e2e-server.sh > "$RUNNER_TEMP/start-server.log" 2>&1
          SERVER_PID="$(sed -n 's/^PID //p' "$RUNNER_TEMP/start-server.log" | tail -1)"
          if [ -z "$SERVER_PID" ]; then
            echo "::error::Backend did not report a PID; see start-server.log artifact."
            exit 1
          fi
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          echo "Backend PID: $SERVER_PID"

      - name: Run real-model checks
        run: |
          set -o pipefail
          echo "::group::Real LLM smoke"
          ./scripts/real-llm-e2e-smoke.sh 2>&1 | tee "$RUNNER_TEMP/real-llm-smoke.log"
          echo "::endgroup::"
          echo "::group::Retrieval goldenset"
          ./scripts/run-retrieval-goldenset.sh 2>&1 | tee "$RUNNER_TEMP/goldenset.log"
          echo "::endgroup::"
          echo "::group::Retrieval quality regression"
          ./scripts/run-retrieval-regression.sh 2>&1 | tee "$RUNNER_TEMP/retrieval-regression.log"
          echo "::endgroup::"

      # 成本护栏：读取后端 Actuator 的请求计数，超硬上限或读不到指标都 fail。
      # 重试本身是有界的（smoke 的 JSON 断言最多一次、Playwright 最多一次），
      # 这里是最后一道"请求量异常"的闸门，不会自动重跑整个 job。
      - name: Model usage guard (hard cap)
        if: always()
        run: |
          mkdir -p .verification/nightly
          node .github/scripts/nightly-model-usage.mjs \
            --base-url "$BASE_URL" \
            --max-requests "$NIGHTLY_MAX_REQUESTS" \
            --report-file .verification/nightly/model-usage.md

      - name: Stop backend
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Failure diagnostics summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .verification/nightly
          node .github/scripts/ci-summary.mjs --surefire \
            | tee .verification/nightly/summary.md

      - name: Upload real-LLM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-real-llm
          path: |
            ${{ runner.temp }}/start-server.log
            ${{ runner.temp }}/real-llm-smoke.log
            ${{ runner.temp }}/goldenset.log
            ${{ runner.temp }}/retrieval-regression.log
            .verification/nightly/
            .verification/retrieval-goldenset/
            .verification/retrieval-regression/
            /tmp/spring-ai-rag-real-e2e.log
          if-no-files-found: warn
          retention-days: 30

  soak:
    name: Bounded soak (mock provider, no paid calls)
    if: github.event_name == 'schedule' || inputs.debug_report_failure != true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LLM_PROVIDER: openai
      SPRING_AI_OPENAI_API_KEY: mock-key
      SPRING_AI_OPENAI_BASE_URL: http://127.0.0.1:8086
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: mock-chat
      RAG_EMBEDDING_API_KEY: mock-key
      RAG_EMBEDDING_BASE_URL: http://127.0.0.1:8086
      RAG_EMBEDDING_MODEL: mock-embedding
      RAG_EMBEDDING_DIMENSIONS: '1024'
      # 覆盖 embedding 身份时必须显式声明 profile key，否则
      # EmbeddingProfileRegistry 会拒绝启动（这是有意的防串维度保护）。
      RAG_EMBEDDING_PROFILE_KEY: mock-soak-1024-v1
      RAG_SECURITY_ENABLED: 'false'
      # soak 脚本自身要带鉴权头发请求；服务端虽关闭校验，脚本仍要求有 key。
      RAG_ROOT_API_KEY: ${{ secrets.RAG_ROOT_API_KEY }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: rag_nightly_soak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rag_nightly_soak
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: '18082'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node (mock provider)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 同 real-llm：先 install，避免 start-real-e2e-server.sh 在干净 checkout
      # 里通过 dependency:build-classpath 去 central 拉本项目 jar。
      - name: Build modules into local repository
        run: mvn -q -B -DskipTests install

      - name: Create isolated database
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE rag_nightly_soak" 2>/dev/null || true
          psql -h localhost -U postgres -d rag_nightly_soak -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h localhost -U postgres -d rag_nightly_soak -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          if psql -h localhost -U postgres -d rag_nightly_soak \
              -c "CREATE EXTENSION IF NOT EXISTS pg_jieba"; then
            echo "pg_jieba: available"
          else
            echo "pg_jieba: unavailable (optional; fulltext falls back to pg_trgm)"
          fi

      # soak 验证的是 HTTP/DB/线程稳定性，不是模型质量：用仓库自带 mock provider，
      # 避免 nightly 产生不受控的付费调用；真实模型质量由 real-llm job 覆盖。
      - name: Run bounded soak
        run: |
          set -euo pipefail
          mkdir -p .verification/nightly
          ./scripts/run-mock-llm.sh --port 8086 > "$RUNNER_TEMP/mock-llm.log" 2>&1 &
          MOCK_PID=$!
          ./scripts/start-real-e2e-server.sh > "$RUNNER_TEMP/start-server.log" 2>&1
          SERVER_PID="$(sed -n 's/^PID //p' "$RUNNER_TEMP/start-server.log" | tail -1)"
          trap 'kill "$SERVER_PID" "$MOCK_PID" 2>/dev/null || true' EXIT
          if [ -z "$SERVER_PID" ]; then
            echo "::error::Backend did not report a PID; see start-server.log artifact."
            exit 1
          fi
          echo "Backend PID: $SERVER_PID (mock PID: $MOCK_PID)"
          python3 scripts/run-bounded-soak.py \
            --base-url http://127.0.0.1:18082 \
            --minutes 10 \
            --concurrency 4 \
            --output-dir .verification/soak/nightly 2>&1 | tee "$RUNNER_TEMP/soak.log"

      # 安全边界全入口回归：自建临时库 + mock provider + demo jar，
      # 覆盖受限 key 的跨 Collection / 跨 principal 读取。
      - name: Run security boundary regression
        run: |
          set -euo pipefail
          python3 scripts/verify-security-boundary.py 2>&1 | tee "$RUNNER_TEMP/security-boundary.log"

      # V71 升级路径：构造 V70 历史数据后升级，验证 fail-closed / root 可见 /
      # 新写入归属，并跑一遍回填脚本的 dry-run 与 --apply。
      - name: Run security upgrade path regression
        run: |
          set -euo pipefail
          python3 scripts/verify-security-upgrade-path.py 2>&1 | tee "$RUNNER_TEMP/security-upgrade.log"

      # 部署态：prod + 认证关闭必须拒绝启动；认证开启可启动；非 prod 仅告警。
      - name: Run security deployment posture regression
        run: |
          set -euo pipefail
          python3 scripts/verify-security-deployment-posture.py 2>&1 | tee "$RUNNER_TEMP/security-posture.log"

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-soak
          path: |
            .verification/soak/nightly/
            ${{ runner.temp }}/soak.log
            ${{ runner.temp }}/security-boundary.log
            ${{ runner.temp }}/security-upgrade.log
            ${{ runner.temp }}/security-posture.log
            ${{ runner.temp }}/start-server.log
            ${{ runner.temp }}/mock-llm.log
          if-no-files-found: warn
          retention-days: 30

  webui-real:
    name: Real WebUI specs (no manual fixtures)
    if: github.event_name == 'schedule' || inputs.debug_report_failure != true
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LLM_PROVIDER: minimax
      SPRING_AI_MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY || secrets.SPRING_AI_MINIMAX_API_KEY }}
      SPRING_AI_MINIMAX_BASE_URL: ${{ vars.SPRING_AI_MINIMAX_BASE_URL || 'https://api.minimaxi.com' }}
      SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL: ${{ vars.SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL || 'MiniMax-M3' }}
      RAG_EMBEDDING_API_KEY: ${{ secrets.RAG_EMBEDDING_API_KEY }}
      RAG_EMBEDDING_BASE_URL: ${{ vars.RAG_EMBEDDING_BASE_URL || 'https://api.siliconflow.cn' }}
      RAG_EMBEDDING_MODEL: BAAI/bge-m3
      RAG_EMBEDDING_DIMENSIONS: '1024'
      RAG_ROOT_API_KEY: ${{ secrets.RAG_ROOT_API_KEY }}
      # Agent 正向验收要求 /models 里存在 toolCalling=true 的可用模型；
      # 默认 YAML 目录把 minimax 标为 false。这里显式打开，与
      # `scripts/verify-chat-capability.sh` 的真实链路使用同一开关。
      APP_MODELS_LEGACY_CAPABILITIES_MINIMAX_TOOL_CALLING: 'true'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: rag_nightly_webui
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rag_nightly_webui
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spring-ai-rag-webui/package-lock.json

      - name: Verify required secrets
        run: |
          missing=()
          [ -n "${SPRING_AI_MINIMAX_API_KEY:-}" ] || missing+=("MINIMAX_API_KEY (or SPRING_AI_MINIMAX_API_KEY)")
          [ -n "${RAG_EMBEDDING_API_KEY:-}" ] || missing+=("RAG_EMBEDDING_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::Nightly real WebUI layer cannot run: missing repository secret '$name'."
            done
            {
              echo "## Nightly real WebUI layer not run"
              echo ""
              echo "Missing repository secret(s):"
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Create isolated database
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE rag_nightly_webui" 2>/dev/null || true
          psql -h localhost -U postgres -d rag_nightly_webui -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h localhost -U postgres -d rag_nightly_webui -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          if psql -h localhost -U postgres -d rag_nightly_webui \
              -c "CREATE EXTENSION IF NOT EXISTS pg_jieba"; then
            echo "pg_jieba: available"
          else
            echo "pg_jieba: unavailable (optional; fulltext falls back to pg_trgm)"
          fi

      - name: Generate root API key when not configured
        run: |
          if [ -z "${RAG_ROOT_API_KEY:-}" ]; then
            printf 'RAG_ROOT_API_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          fi

      - name: Materialize .env for dev stack
        run: |
          umask 077
          : > .env
          for name in \
            LLM_PROVIDER \
            SPRING_AI_MINIMAX_API_KEY SPRING_AI_MINIMAX_BASE_URL SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL \
            RAG_EMBEDDING_API_KEY RAG_EMBEDDING_BASE_URL RAG_EMBEDDING_MODEL RAG_EMBEDDING_DIMENSIONS \
            RAG_ROOT_API_KEY \
            APP_MODELS_LEGACY_CAPABILITIES_MINIMAX_TOOL_CALLING \
            POSTGRES_HOST POSTGRES_PORT POSTGRES_DATABASE POSTGRES_USER POSTGRES_PASSWORD \
            SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD; do
            value="${!name:-}"
            [ -z "$value" ] || printf '%s=%s\n' "$name" "$value" >> .env
          done

      - name: Install WebUI dependencies
        working-directory: spring-ai-rag-webui
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('spring-ai-rag-webui/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: spring-ai-rag-webui
        run: npx playwright install --with-deps chromium

      - name: Start isolated dev stack
        run: ./scripts/dev.sh start

      # alerts-real 需要预置告警/投递 ID，rerank-document-diversity-real 需要
      # rerank fixture；两者属于"需要人工 fixture"，不在 nightly 自动执行。
      # 真实模型驱动的三个 spec 没有人工 fixture 依赖。允许一次重试：模型
      # 偶发改写事实（已实测把 09:40 说成 09:30），Playwright 会把这类结果
      # 记为 flaky 并显示在摘要里，所以重试不会被当成通过而隐瞒。
      - name: Run real WebUI specs
        working-directory: spring-ai-rag-webui
        env:
          BASE_URL: http://127.0.0.1:15173
        run: |
          npx playwright test \
            --config=playwright.config.ts \
            --retries=1 \
            e2e/api-key-real.spec.ts \
            e2e/chat-real.spec.ts \
            e2e/files-real.spec.ts

      - name: Failure diagnostics summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .verification/nightly
          node "$GITHUB_WORKSPACE/.github/scripts/ci-summary.mjs" --playwright \
            | tee .verification/nightly/webui-summary.md

      - name: Stop dev stack
        if: always()
        run: ./scripts/dev.sh --stop || true

      - name: Upload real WebUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-webui-real
          path: |
            spring-ai-rag-webui/playwright-report/
            spring-ai-rag-webui/test-results/
            .verification/nightly/
            .dev/backend.log
            .dev/frontend.log
          if-no-files-found: warn
          retention-days: 30

  # 失败可见性：GitHub 页面变红不会有人天天看，所以用一个固定标题的追踪 issue。
  # 失败 → 创建或更新该 issue（附 run 链接、失败 job、artifact 里的关键日志尾部）；
  # 恢复 → 评论并关闭。只在 schedule 触发时动 issue；手动 dispatch 默认只写 notice，
  # 避免调试时意外开 issue。
  # 例外：workflow_dispatch 的 debug_report_failure 输入会只跑本 job、跳过四个检查
  # job（不产生模型调用），用 [TEST] 标题走一遍真实的创建/更新/评论路径。
  report:
    name: Nightly status report
    needs: [gated-postgres, real-llm, soak, webui-real]
    if: always() && (github.event_name == 'schedule' || inputs.debug_report_failure == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Download nightly artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: .verification/artifacts
          pattern: nightly-*
          merge-multiple: false

      - name: Build tracking issue body
        id: issue
        env:
          RESULT_GATED: ${{ needs.gated-postgres.result }}
          RESULT_REAL_LLM: ${{ needs.real-llm.result }}
          RESULT_SOAK: ${{ needs.soak.result }}
          RESULT_WEBUI: ${{ needs.webui-real.result }}
          NIGHTLY_DEBUG: ${{ inputs.debug_report_failure == true }}
          NIGHTLY_FORCE_FAILURE: ${{ inputs.debug_report_failure == true }}
        run: |
          mkdir -p .verification/nightly
          node .github/scripts/nightly-issue.mjs \
            --artifact-dir .verification/artifacts \
            --body-file .verification/nightly/issue-body.md

      - name: Create, update or close tracking issue
        if: always()
        uses: actions/github-script@v7
        env:
          NIGHTLY_STATUS: ${{ steps.issue.outputs.status }}
          NIGHTLY_FAILED_JOBS: ${{ steps.issue.outputs.failed_jobs }}
          NIGHTLY_ISSUE_TITLE: ${{ steps.issue.outputs.issue_title }}
          NIGHTLY_ALLOW_DISPATCH: ${{ inputs.debug_report_failure == true }}
          NIGHTLY_BODY_FILE: .verification/nightly/issue-body.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = process.env.NIGHTLY_ISSUE_TITLE || '[Nightly] Long-running layer failing';
            const allowDispatch = process.env.NIGHTLY_ALLOW_DISPATCH === 'true';
            // 汇总脚本本身失败时也要让失败可见：把缺失的状态按 failure 处理。
            const status = process.env.NIGHTLY_STATUS || 'failed';
            const failed = process.env.NIGHTLY_FAILED_JOBS || 'report job could not build the body';
            let body;
            try {
              body = fs.readFileSync(process.env.NIGHTLY_BODY_FILE, 'utf8');
            } catch (error) {
              body = [
                '## Nightly status report failed',
                '',
                `- Run: ${runUrl}`,
                '- The reporting job could not build the tracking body; check the run log.',
              ].join('\n');
            }

            if (context.eventName !== 'schedule' && !allowDispatch) {
              core.notice(
                `Nightly status: ${status}. Issue automation only runs on scheduled runs; ` +
                'manual workflow_dispatch does not create, update or close issues.'
              );
              return;
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => issue.title === title && !issue.pull_request
            );

            if (status === 'failed') {
              if (existing) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, body,
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Nightly run [#${context.runNumber}](${runUrl}) failed again (${failed}).`,
                });
                core.notice(`Updated existing tracking issue #${existing.number}.`);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title, body });
                core.notice(`Opened tracking issue #${created.data.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Nightly recovered in run [#${context.runNumber}](${runUrl}); closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
              core.notice(`Closed tracking issue #${existing.number}.`);
            } else {
              core.notice('Nightly is green and there is no open tracking issue.');
            }
